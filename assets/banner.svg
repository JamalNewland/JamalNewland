<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 280">

  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#080C14"/>
      <stop offset="100%" stop-color="#201038"/>
    </linearGradient>

    <linearGradient id="neon">
      <stop stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30"
            fill="none"
            stroke="#64748b"
            opacity="0.09"/>

            <animateTransform
    attributeName="patternTransform"
    type="translate"
    from="0 0"
    to="30 30"
    dur="8s"
    repeatCount="indefinite"/>

    </pattern>

    <filter id="glow" x="-50%" y="-300%"
        width="200%" height="700%">

  <feGaussianBlur stdDeviation="3"
                  result="blur"/>

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>

  </defs>

  <rect width="900" height="280"
        rx="14" fill="url(#background)"/>

  <rect width="900" height="280"
        rx="14" fill="url(#grid)"/>

  <path d="M20 70 V20 H100
           M800 20 H880 V70
           M20 210 V260 H100
           M800 260 H880 V210"
        stroke="url(#neon)"
        stroke-width="2"
        fill="none"/>

  <circle cx="45" cy="45" r="4" fill="#00D9FF">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <g font-family="monospace" font-size="12">
    <text x="60" y="50" fill="#00D9FF">
      SYSTEM ONLINE
    </text>

    <text x="850" y="50"
          text-anchor="end" fill="#94a3b8">
      BUILD_001
    </text>
  </g>

  <text x="450" y="120"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        letter-spacing="5"
        fill="#F1F5F9">
    JAMAL NEWLAND
  </text>

  <rect x="250" y="140"
        width="400" height="3"
        fill="url(#neon)"/>

  <text x="450" y="175"
        text-anchor="middle"
        font-family="monospace"
        font-size="16"
        letter-spacing="4"
        fill="#00D9FF">
    SOFTWARE DEVELOPER IN PROGRESS
  </text>

  <text x="450" y="212"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#cbd5e1">
    The beginning of something extraordinary.
  </text>

  <g font-family="monospace" font-size="12">
    <text x="45" y="248" fill="#a78bfa">
    INITIALIZING FUTURE<tspan>_
  <animate attributeName="opacity"
           values="1;0;1"
           dur="1s"
           calcMode="discrete"
           repeatCount="indefinite"/>
</tspan>
      
    </text>

    <text x="850" y="248"
          text-anchor="end" fill="#64748b">
      v.02 
    </text>
  </g>

    <rect x="250" y="140"
        width="60" height="3"
        rx="1.5" fill="#FFFFFF" filter="url(#glow)">
        

    <animate attributeName="x"
             values="250;590;250"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.3;1;0.3"
             dur="2s"
             repeatCount="indefinite"/>

  </rect>

</svg>

  